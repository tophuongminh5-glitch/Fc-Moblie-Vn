<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EA SPORTS FC Mobile</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FC Mobile">
    
    <!-- Link ảnh đại diện gốc FC Mobile đã được tối ưu hóa cho iOS -->
    <link rel="apple-touch-icon" href="https://imgbox.com">

    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            user-select: none; -webkit-user-select: none;
        }
        .container { text-align: center; width: 90%; max-width: 400px; }
        .alert-box {
            border: 2px solid #ff3b30; background-color: rgba(255, 59, 48, 0.08);
            border-radius: 12px; padding: 25px 15px;
            box-shadow: 0 8px 32px rgba(255, 59, 48, 0.2);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        }
        .alert-title { color: #ff3b30; font-size: 22px; font-weight: 800; margin: 0 0 10px 0; text-transform: uppercase; }
        .alert-desc { color: #cccccc; font-size: 14px; line-height: 1.4; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="alert-box">
            <p class="alert-title">Thông Báo Cấm</p>
            <p class="alert-desc">Tài khoản của bạn đã bị cấm vĩnh viễn khỏi hệ thống.</p>
        </div>
    </div>
</body>
</html>
