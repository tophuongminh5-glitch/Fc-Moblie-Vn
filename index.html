<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHÉP TRẬN SIÊU SAO</title>
    <style>
        :root {
            --primary-glow: #00ff66;
            --secondary-glow: #00e1ff;
            --bg-gradient: radial-gradient(circle at 50% 45%, #111520 0%, #06080c 100%);
            --card-bg: rgba(15, 19, 28, 0.9);
            --card-border: rgba(255, 255, 255, 0.04);
            --text-main: #ffffff;
            --text-sub: #5a697c;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, rgba(0, 225, 255, 0.08), rgba(0, 255, 102, 0.03));
            filter: blur(130px);
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 45px 35px;
            border-radius: 28px;
            border: 1px solid var(--card-border);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-sizing: border-box;
            z-index: 1;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 4px;
            margin: 0 0 6px 0;
            background: linear-gradient(180deg, #ffffff 0%, #bdc3c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .option-group {
            display: flex;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 40px;
        }

        .option-card {
            flex: 1;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 22px 10px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .option-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .option-card input[type="radio"] {
            display: none;
        }

        .option-card span {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #8a99ad;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
        }

        .option-card.active {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, rgba(0, 225, 255, 0.01) 100%);
            border-color: rgba(0, 225, 255, 0.4);
            box-shadow: 0 10px 25px rgba(0, 225, 255, 0.08), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .option-card.active span {
            color: #00e1ff;
            text-shadow: 0 0 15px rgba(0, 225, 255, 0.5);
            font-weight: 700;
        }

        .progress-container {
            display: none;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            height: 4px;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.01);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ff66, #00e1ff);
            box-shadow: 0 0 8px rgba(0, 225, 255, 0.5);
            transition: width 0.1s linear;
        }

        .btn-submit {
            background: linear-gradient(135deg, #00ff66 0%, #00e1ff 100%);
            color: #030508;
            border: none;
            padding: 18px 32px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 12px 30px rgba(0, 255, 102, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 35px rgba(0, 225, 255, 0.3);
            filter: brightness(1.08);
        }

        .btn-submit:disabled {
            background: #181d26;
            color: #404b5c;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .status {
            margin-top: 25px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-sub);
            min-height: 20px;
            letter-spacing: 0.8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>GHÉP TRẬN LÊN SIÊU SAO</h2>
    <div class="subtitle">Hệ Thống Kết Nối Nâng Cao</div>
    
    <div class="option-group">
        <label class="option-card active" onclick="selectOption(this)">
            <input type="radio" name="app_version" value="global" checked>
            <span>FC GLOBAL</span>
        </label>
        
        <label class="option-card" onclick="selectOption(this)">
            <input type="radio" name="app_version" value="vn">
            <span>FC VIỆT NAM</span>
        </label>
    </div>

    <div class="progress-container" id="progress-box">
        <div class="progress-bar" id="progress-fill"></div>
    </div>

    <button class="btn-submit" id="submit-btn" onclick="startMatchmaking()">Ghép Trận Ngay</button>
    
    <div class="status" id="status-text"></div>
</div>

<script>
    function selectOption(element) {
        const btn = document.getElementById('submit-btn');
        if (btn.disabled) return; 
        
        const cards = document.querySelectorAll('.option-card');
        cards.forEach(card => card.classList.remove('active'));
        element.classList.add('active');
        
        element.querySelector('input[type="radio"]').checked = true;
    }

    function startMatchmaking() {
        const selectedVersion = document.querySelector('input[name="app_version"]:checked').value;
        const statusText = document.getElementById('status-text');
        const submitBtn = document.getElementById('submit-btn');
        const progressBox = document.getElementById('progress-box');
        const progressFill = document.getElementById('progress-fill');
        
        submitBtn.disabled = true;
        progressBox.style.display = "block";
        statusText.style.color = '#00e1ff';
        statusText.innerText = "ĐANG TÌM KIẾM ĐỐI THỦ PHÙ HỢP...";

        // Cập nhật URL Schemes chính xác tương thích với hệ điều hành iOS
        let appUrl = selectedVersion === "global" ? "fifamobile://" : "fcmvn://";

        let width = 0;
        let interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                
                statusText.style.color = '#00ff66';
                statusText.innerText = "ĐÃ TỐI ƯU PHÒNG CHỜ! ĐANG VÀO GAME...";
                
                setTimeout(() => {
                    window.location.href = appUrl;
                    
                    setTimeout(() => {
                        statusText.style.color = '#ff4a4a';
                        statusText.innerText = "KHÔNG TÌM THẤY ỨNG DỤNG TRÊN THIẾT BỊ";
                        submitBtn.disabled = false;
                    }, 2500);
                }, 500);
            } else {
                width += 2;
                progressFill.style.width = width + '%';
                if(width === 40) statusText.innerText = "ĐANG CÂN BẰNG ĐIỂM XẾP HẠNG SIÊU SAO...";
                if(width === 80) statusText.innerText = "ĐANG ĐỒNG BỘ MÃ PHÒNG TRẬN ĐẤU...";
            }
        }, 40);
    }
</script>

</body>
</html>
