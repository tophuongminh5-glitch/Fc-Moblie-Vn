<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Ngăn người dùng zoom trên iPhone để giống app thật hơn -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EA SPORTS FC Mobile</title>
    
    <!-- CẤU HÌNH BẮT BUỘC CHO IOS (SAFARI) -->
    <!-- Bật chế độ chạy toàn màn hình (Standalone) sau khi thêm vào MH chính -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Đổi màu thanh trạng thái (pin, sóng) thành màu đen hòa vào nền ứng dụng -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Tên hiển thị dưới icon ở màn hình chính iPhone -->
    <meta name="apple-mobile-web-app-title" content="FC Mobile">
    <!-- Đường dẫn ảnh icon hiển thị ngoài màn hình chính iOS -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <style>
        /* Tối ưu giao diện tràn viền trên các dòng iPhone tai thỏ / Dynamic Island */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-user-select: none; /* Không cho copy text trên iOS */
            user-select: none;
        }

        .container {
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            width: 90%;
            max-width: 400px;
        }

        /* Khung thông báo lỗi màu đỏ kiểu iOS/Game */
        .alert-box {
            border: 2px solid #ff3b30; /* Màu đỏ chuẩn iOS */
            background-color: rgba(255, 59, 48, 0.08);
            border-radius: 12px;
            padding: 25px 15px;
            box-shadow: 0 8px 32px rgba(255, 59, 48, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: shake 0.4s ease-in-out; /* Hiệu ứng rung nhẹ khi mở */
        }

        .alert-title {
            color: #ff3b30;
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .alert-desc {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.4;
            margin: 0;
        }

        /* Hiệu ứng rung báo lỗi */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="alert-box">
            <p class="alert-title">Thông Báo Cấm</p>
            <p class="alert-desc">Tài khoản của bạn đã bị cấm vĩnh viễn do vi phạm điều khoản dịch vụ.</p>
        </div>
    </div>

</body>
</html>
